name: Bug Report
description: Report a bug or issue
title: "[BUG] Brief description"
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "Thank you for reporting an issue!"
  
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - GPS/GNSS Traveler
        - SeedLink Monitor
        - Other
    validations:
      required: true
  
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g., Windows 11, Raspberry Pi OS"
    validations:
      required: true
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug clearly
    validations:
      required: true
  
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: |
        1.
        2.
        3.
    validations:
      required: true
  
  - type: textarea
    id: error
    attributes:
      label: Error Message / Logs
      description: Paste any error messages or logs
      render: bash
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
