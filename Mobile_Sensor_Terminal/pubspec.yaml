name: sensor_terminal
description: GaiaCode Universal Sensor Terminal - Mobile
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bluetooth_serial: ^0.4.0
  usb_serial: ^0.5.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  permission_handler: ^12.0.1
  vibration: ^3.1.8
  path_provider: ^2.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/Gaiacode.png
    - assets/logo.png
